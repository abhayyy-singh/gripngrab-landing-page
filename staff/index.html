<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grip&amp;Grab Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c0c; --surface: #161616; --sur2: #1e1e1e; --sur3: #262626; --border: rgba(255,255,255,0.08);
      --text: #f0f0f0; --muted: rgba(255,255,255,0.45); --faint: rgba(255,255,255,0.25); --accent: #ff6b6b;
      --green: #4ade80; --yellow: #fbbf24; --red: #ff6b6b; --blue: #60a5fa;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
    a { color: inherit; }
    button, input, select { font-family: inherit; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.15); border-top-color: var(--accent);
      animation: spin .7s linear infinite; display: inline-block; flex-shrink: 0;
    }
    .spinner.sm { width: 13px; height: 13px; border-width: 2px; }

    #loading {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); font-size: 13px;
    }

    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 16px; height: 54px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 20;
    }
    .header-brand { font-size: 15px; font-weight: 700; background: linear-gradient(135deg,#ff6b6b,#f7d794); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .role-badge { background: rgba(96,165,250,0.15); color: var(--blue); border: 1px solid rgba(96,165,250,0.3); border-radius: 99px; padding: 3px 10px; font-weight: 600; font-size: 11px; text-transform: uppercase; }
    .role-badge.owner { background: rgba(74,222,128,0.15); color: var(--green); border-color: rgba(74,222,128,0.3); }
    .signout-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }

    .tabs { display: flex; gap: 4px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: 54px; z-index: 19; }
    .tab-btn { background: none; border: none; color: var(--muted); padding: 13px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-count { background: var(--sur3); color: var(--muted); border-radius: 99px; padding: 1px 7px; font-size: 10.5px; margin-left: 6px; }

    .main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Due-status summary strip ── */
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 14px; transition: opacity .15s; }
    .stat-tile {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      cursor: pointer; transition: border-color .15s; text-align: left;
    }
    .stat-tile:hover { border-color: rgba(255,255,255,0.2); }
    .stat-tile.selected { border-color: var(--accent); background: var(--sur2); }
    .stat-tile .num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-tile .lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
    .stat-tile.overdue .num { color: var(--red); }
    .stat-tile.due .num { color: var(--yellow); }
    .stat-tile.active .num { color: var(--green); }
    .stat-tile.unknown .num { color: var(--muted); }
    .stat-tile.inactive .num { color: var(--faint); }
    .stat-tile.verify .num { color: #c084fc; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
    .toolbar select, .toolbar input[type=text] {
      background: var(--sur2); border: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; border-radius: 10px; font-size: 13px;
    }
    .toolbar input[type=text] { flex: 1; min-width: 160px; }
    .btn {
      background: linear-gradient(135deg,#ff6b6b,#f7d794); color: #000; border: none; border-radius: 10px;
      padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-ghost { background: var(--sur2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }

    /* ── Sync progress ── */
    .sync-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none; }
    .sync-panel.show { display: block; }
    .sync-status-line { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 10px; }
    .progress-track { height: 6px; background: var(--sur2); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg,#ff6b6b,#f7d794); border-radius: 99px; width: 5%; transition: width .4s ease; }
    .sync-result { margin-top: 12px; font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
    .sync-result strong { color: var(--text); }

    .card-list { display: flex; flex-direction: column; gap: 8px; }
    .member-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; }
    .member-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .member-name { font-size: 14.5px; font-weight: 700; }
    .member-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .attend-line { font-size: 11px; color: var(--faint); margin-top: 4px; }
    .attend-line.recent { color: var(--green); }
    .attend-line.stale { color: var(--yellow); }
    .attend-line.none { color: var(--red); }
    .pill { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; flex-shrink: 0; }
    .pill.active   { background: rgba(74,222,128,0.15); color: var(--green); }
    .pill.due      { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .pill.overdue  { background: rgba(255,107,107,0.15); color: var(--red); }
    .pill.unknown  { background: rgba(255,255,255,0.08); color: var(--muted); }
    .pill.inactive { background: rgba(255,255,255,0.06); color: var(--faint); }
    .pill.verify   { background: rgba(192,132,252,0.15); color: #c084fc; }
    .member-row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border); }
    .contact-block { font-size: 12px; color: var(--text); display: flex; flex-direction: column; gap: 2px; }
    .contact-block .contact-item { display: flex; gap: 6px; }
    .contact-block .contact-item .k { color: var(--faint); min-width: 42px; }
    .contact-hidden-label { font-size: 12px; color: var(--faint); font-style: italic; }
    .card-actions { display: flex; gap: 6px; }

    .guess-bulk-bar { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 12.5px; position: sticky; top: 0; z-index: 2; }
    .guess-select-all { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
    #guess-selected-count { color: var(--muted); flex: 1; }
    .guess-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .guess-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
    .guess-amount { font-size: 12px; color: var(--text); }
    .guess-plan-select { font-size: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
    .guess-plan-line { display: flex; align-items: center; gap: 8px; }
    .guess-anchor-fields { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
    .guess-anchor-fields label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
    .guess-anchor-fields input[type="date"] { font-size: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
    .guess-confidence { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 2px 6px; border-radius: 99px; }
    .guess-confidence.high { color: var(--green); background: rgba(74,222,128,0.12); }
    .guess-confidence.low { color: var(--faint); background: rgba(255,255,255,0.06); }
    .change-field-hl { color: var(--yellow); font-weight: 600; }
    .guess-confirm-btn { color: var(--green); border-color: rgba(74,222,128,0.3); }

    .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
    .review-type { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--yellow); letter-spacing: .04em; }
    .review-sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
    .review-data { font-size: 12.5px; color: var(--muted); margin: 8px 0; word-break: break-word; background: var(--sur2); border-radius: 8px; padding: 8px 10px; }
    .review-data strong { color: var(--text); }
    .review-actions { display: flex; gap: 8px; margin-top: 8px; }

    .audit-row { border-bottom: 1px solid var(--border); padding: 11px 0; font-size: 12.5px; }
    .audit-actor { font-weight: 700; }
    .audit-action { color: var(--blue); }
    .audit-time { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 13px; }
    .loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 50px 20px; color: var(--muted); font-size: 13px; }

    /* ── Edit modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 16px; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .02em; }
    .field input, .field select {
      width: 100%; background: var(--sur2); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 9px; font-size: 13.5px;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
    .modal-err { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Signing in…</div>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <div class="header-brand">Grip&amp;Grab Staff</div>
    <div class="header-right">
      <span id="user-email"></span>
      <span class="role-badge" id="role-badge">—</span>
      <button class="signout-btn" id="signout-btn">Sign Out</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="members">Members <span class="tab-count" id="members-count"></span></button>
    <button class="tab-btn" data-tab="review">Migration Review <span class="tab-count" id="review-count"></span></button>
    <button class="tab-btn" id="audit-tab-btn" data-tab="audit" style="display:none;">Audit Log</button>
  </div>

  <div class="main">

    <!-- MEMBERS -->
    <div class="tab-content active" id="tab-members">

      <div id="center-label" style="font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;"></div>
      <div class="stat-row" id="stat-row"></div>
      <div id="stat-caption" style="font-size:11.5px;color:var(--faint);margin:-6px 0 14px;"></div>

      <div class="toolbar">
        <select id="center-filter">
          <option value="all">All Centers</option>
          <option value="saket">Saket</option>
          <option value="lajpat">Lajpat Nagar</option>
        </select>
        <input type="text" id="search-input" placeholder="Search by name…">
        <button class="btn btn-ghost" id="add-member-btn">+ Add Member</button>
        <button class="btn" id="sync-btn">Sync Now</button>
      </div>

      <div class="sync-panel" id="sync-panel">
        <div class="sync-status-line">
          <span class="spinner sm" id="sync-spinner"></span>
          <span id="sync-status-text">Starting…</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="sync-result" id="sync-result"></div>
      </div>

      <div id="members-list" class="card-list">
        <div class="loading-row"><span class="spinner"></span> Loading members…</div>
      </div>
    </div>

    <!-- MIGRATION REVIEW -->
    <div class="tab-content" id="tab-review">
      <div class="toolbar">
        <select id="review-center-filter">
          <option value="all">All Centers</option>
          <option value="saket">Saket</option>
          <option value="lajpat">Lajpat Nagar</option>
        </select>
        <button class="btn btn-ghost" id="refresh-review-btn">Refresh</button>
      </div>
      <div id="review-list"><div class="loading-row"><span class="spinner"></span> Loading…</div></div>
    </div>

    <!-- AUDIT LOG -->
    <div class="tab-content" id="tab-audit">
      <input type="text" id="audit-search" placeholder="Filter by member or staff name…" style="margin-bottom:10px;">
      <div id="audit-list"><div class="loading-row"><span class="spinner"></span> Loading…</div></div>
    </div>

  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="edit-backdrop">
  <div class="modal">
    <h3 id="modal-title">Edit Member</h3>
    <div class="field"><label>Name</label><input type="text" id="f-name"></div>
    <div class="field" id="f-center-field">
      <label>Center</label>
      <select id="f-center">
        <option value="saket">Saket</option>
        <option value="lajpat">Lajpat Nagar</option>
      </select>
    </div>
    <div class="field">
      <label>Plan</label>
      <select id="f-plan">
        <option value="">— not set —</option>
        <option value="monthly">Monthly</option>
        <option value="quarterly">Quarterly</option>
        <option value="half-yearly">Half-Yearly</option>
        <option value="yearly">Yearly</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="field"><label>Start Date</label><input type="date" id="f-start"></div>
    <div class="field"><label>Due Date</label><input type="date" id="f-due"></div>
    <div class="field"><label>Default Fee (₹)</label><input type="number" id="f-fee"></div>
    <div class="field"><label>Phone</label><input type="text" id="f-phone"></div>
    <div class="field"><label>Email</label><input type="text" id="f-email"></div>
    <div class="field">
      <label>Paused Until <span style="text-transform:none;font-weight:400;">(leave blank if not paused)</span></label>
      <input type="date" id="f-paused">
    </div>
    <div class="field" id="attendance-summary-field" style="display:none;">
      <label>Attendance Summary <span style="text-transform:none;font-weight:400;">(last 3 months)</span></label>
      <div id="attendance-summary" style="font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;"></div>
    </div>
    <div class="field" id="payment-history-field" style="display:none;">
      <label>Payment History</label>
      <div id="payment-history-list" style="font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px;"></div>
    </div>
    <div class="field" id="change-history-field" style="display:none;">
      <label>Recent Changes <span style="text-transform:none;font-weight:400;">(owner only)</span></label>
      <div id="change-history-list" style="font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px;"></div>
    </div>
    <div class="modal-err" id="edit-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="edit-cancel">Cancel</button>
      <button class="btn btn-sm" id="edit-save">Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const FIREBASE_CONFIG = {
    apiKey:            'AIzaSyB8hiRT58l-n5f5nbaqtuViCJeOqEMp-_k',
    authDomain:        'gripngrab.firebaseapp.com',
    projectId:         'gripngrab',
    storageBucket:     'gripngrab.firebasestorage.app',
    messagingSenderId: '568040807328',
    appId:             '1:568040807328:web:e9ee4f1328064a3d69e2c5',
  };

  const app  = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);

  let idToken = null;
  let myRole = null;
  let allMembers = [];
  let activeDueFilter = 'all';

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = './login.html'; return; }
    idToken = await user.getIdToken();
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadMembers();
  });

  document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}`, ...(options.headers || {}) },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  /* ── Tabs ── */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'review') loadReview();
      if (btn.dataset.tab === 'audit') loadAudit();
    });
  });

  /* ── Members ── */
  /* activityStatus is computed server-side during sync (it needs attendance
     history, which only the sync has) — separates people who are overdue
     AND still training from people who've clearly stopped coming, so the
     due-list isn't cluttered with members who effectively already left. */
  function dueStatus(m) {
    // activityStatus checked BEFORE dueDate deliberately — it's the
    // server's authoritative classification for this member as of the
    // last sync; trusting a client-side dueDate comparison first risked
    // showing a stale in-the-past dueDate as "Overdue" even once the
    // server had already reclassified them (fixed server-side too, but
    // this stays as a second layer rather than relying on that alone).
    if (m.activityStatus === 'inactive') return { label: 'Inactive', cls: 'inactive' };
    if (m.activityStatus === 'needs-verification') return { label: 'Verify Payment', cls: 'verify' };
    if (!m.dueDate) return { label: 'Unknown', cls: 'unknown' };
    const today = new Date().toISOString().slice(0, 10);
    if (m.dueDate < today) return { label: 'Overdue', cls: 'overdue' };
    const in7 = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
    if (m.dueDate <= in7) return { label: 'Due Soon', cls: 'due' };
    return { label: 'Active', cls: 'active' };
  }

  async function loadMembers() {
    document.getElementById('members-list').innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading members…</div>';
    document.getElementById('stat-row').style.opacity = '0.35';
    document.getElementById('center-label').innerHTML = '<span class="spinner sm" style="vertical-align:-2px;"></span> Loading…';
    try {
      const center = document.getElementById('center-filter').value;
      const { members, role } = await api(`/api/staff/members?center=${center}`);
      allMembers = members;
      if (myRole !== role) { myRole = role; applyRoleUI(); }
      document.getElementById('members-count').textContent = members.length;
      document.getElementById('center-label').textContent =
        'Showing: ' + (center === 'all' ? 'All Centers' : center === 'saket' ? 'Saket' : 'Lajpat Nagar');
      renderStats();
      renderMembers();
    } catch (e) {
      document.getElementById('members-list').innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
    }
  }

  function applyRoleUI() {
    const badge = document.getElementById('role-badge');
    badge.textContent = myRole;
    badge.classList.toggle('owner', myRole === 'owner');
    document.getElementById('audit-tab-btn').style.display = myRole === 'owner' ? 'inline-block' : 'none';
  }

  function renderStats() {
    document.getElementById('stat-row').style.opacity = '1';
    const counts = { overdue: 0, due: 0, active: 0, unknown: 0, inactive: 0, verify: 0 };
    for (const m of allMembers) counts[dueStatus(m).cls]++;
    const tiles = [
      { key: 'all',      cls: '',         num: allMembers.length, lbl: 'All Members' },
      { key: 'overdue',  cls: 'overdue',  num: counts.overdue,    lbl: 'Overdue' },
      { key: 'verify',   cls: 'verify',   num: counts.verify,     lbl: 'Verify Payment' },
      { key: 'due',      cls: 'due',      num: counts.due,        lbl: 'Due Soon' },
      { key: 'active',   cls: 'active',   num: counts.active,     lbl: 'Active' },
      { key: 'inactive', cls: 'inactive', num: counts.inactive,   lbl: 'Inactive' },
      { key: 'unknown',  cls: 'unknown',  num: counts.unknown,    lbl: 'No Plan Set' },
    ];
    document.getElementById('stat-row').innerHTML = tiles.map(t => `
      <button class="stat-tile ${t.cls} ${activeDueFilter === t.key ? 'selected' : ''}" data-filter="${t.key}">
        <div class="num">${t.num}</div>
        <div class="lbl">${t.lbl}</div>
      </button>`).join('');
    document.querySelectorAll('.stat-tile').forEach(el => el.addEventListener('click', () => {
      activeDueFilter = el.dataset.filter;
      renderStats(); renderMembers();
    }));

    const CAPTIONS = {
      overdue:  "Due date has passed and they're still training regularly — a normal reminder case.",
      verify:   "Due for 3+ weeks but still attending regularly — usually means they paid and it wasn't recorded. Check Migration Review to resolve these.",
      due:      'Due within the next 7 days — not overdue yet.',
      active:   "Not due yet, or overdue but genuinely on a pause.",
      inactive: "Overdue and hasn't attended in 15+ days — likely already left, no point sending reminders.",
      unknown:  "We don't know their plan (monthly/quarterly/etc.), so a due date can't be calculated. Each row below shows a guessed plan based on their last payment amount — check it and hit Confirm, or select several and confirm together.",
    };
    document.getElementById('stat-caption').textContent = CAPTIONS[activeDueFilter] || '';
  }

  const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatShortDate(iso) {
    if (!iso) return null;
    const [y, mo, d] = iso.split('-').map(Number);
    const thisYear = new Date().getFullYear();
    // Year suffix only when it differs from the current year — keeps most
    // dates short, but disambiguates e.g. a yearly-plan due date that lands
    // in next year (23 Mar 27) instead of reading like it's already past.
    const yearSuffix = y !== thisYear ? ` ${String(y).slice(2)}` : '';
    return `${d} ${SHORT_MONTHS[mo - 1]}${yearSuffix}`;
  }

  /* ── Plan guessing (for "No Plan Set" members) ──
     Two tiers:
     1. High-confidence anchors — amounts that sit right on (or within a
        small tolerance of) the actual GST-inclusive website prices you
        confirmed (adult monthly ~5k-9.4k, adult quarterly ~21k ± 2k).
        These are basically certain, so they're checked first.
     2. Wide empirical bands — derived from Lajpat's real payment/duration
        data (which has explicit amount+duration pairs, unlike Saket) —
        fallback for amounts that don't land on a known anchor. Lower
        confidence: real prices vary (discounts, old pricing, etc.).
     Kids' pricing runs lower than adults' across the board throughout. */
  function guessPlanFromAmount(amount, isKid) {
    if (!amount) return { plan: null, confidence: null };
    const near = (target, tolerance) => Math.abs(amount - target) <= tolerance;

    if (isKid) {
      if (amount >= 3000 && amount <= 6500) return { plan: 'monthly', confidence: 'high' };
    } else {
      if (amount >= 4500 && amount <= 9800) return { plan: 'monthly', confidence: 'high' };
      if (near(21000, 2000)) return { plan: 'quarterly', confidence: 'high' };
    }

    const band = isKid
      ? (amount <= 6000 ? 'monthly' : amount <= 13000 ? 'quarterly' : amount <= 25000 ? 'half-yearly' : 'yearly')
      : (amount <= 15000 ? 'monthly' : amount <= 30000 ? 'quarterly' : amount <= 60000 ? 'half-yearly' : 'yearly');
    return { plan: band, confidence: 'low' };
  }
  const PLAN_LABELS = { monthly: 'Monthly', quarterly: 'Quarterly', 'half-yearly': 'Half-Yearly', yearly: 'Yearly' };
  let selectedGuessIds = new Set();

  // "AUG-26" / "AUG 26" -> {year, monthIdx} — mirrors the server's own tab
  // parsing (parseSheets.js monthKeyFromTabName) so a card's fallback label
  // means the same thing Payment History means by the same tab reference.
  function monthTabParts(tab) {
    const m = /([A-Z]{3})/i.exec(tab || '');
    const y = /(\d{2,4})/.exec(tab || '');
    if (!m || !y) return null;
    let year = parseInt(y[1], 10); if (year < 100) year += 2000;
    const abbr = m[1].toUpperCase() === 'FAB' ? 'FEB' : m[1].toUpperCase();
    const monthIdx = SHORT_MONTHS.findIndex(s => s.toUpperCase() === abbr);
    return monthIdx === -1 ? null : { year, monthIdx };
  }

  function paymentLine(m) {
    if (m.lastPaymentDate) {
      const daysAgo = Math.floor((Date.now() - new Date(m.lastPaymentDate).getTime()) / 86400000);
      const cls = daysAgo <= 35 ? 'recent' : daysAgo <= 100 ? 'stale' : 'none';
      return `<div class="attend-line ${cls}">Last fee paid on ${formatShortDate(m.lastPaymentDate)}</div>`;
    }
    // No exact date, but we know which month's tab the payment was
    // recorded in (Saket has no per-payment date column at all) — show
    // that instead of a flat "no payment", which would otherwise disagree
    // with what Payment History shows as the most recent entry.
    if (m.lastPaymentTab) {
      const parts = monthTabParts(m.lastPaymentTab);
      const label = parts ? `${SHORT_MONTHS[parts.monthIdx]} ${parts.year}` : m.lastPaymentTab;
      // Days-ago is only approximate here (day-of-month is unknown) —
      // measured from the 1st of that month, so it reads as "at least this
      // stale", never fresher than reality.
      const daysAgo = parts ? Math.floor((Date.now() - Date.UTC(parts.year, parts.monthIdx, 1)) / 86400000) : null;
      const cls = daysAgo === null ? 'stale' : daysAgo <= 35 ? 'recent' : daysAgo <= 100 ? 'stale' : 'none';
      return `<div class="attend-line ${cls}">Last fee paid in ${label}</div>`;
    }
    return `<div class="attend-line none">No fee payment on record in last 3 months</div>`;
  }

  /* Separate from payment status — this is "are they even coming", which
     matters most for members who show as due/overdue but haven't set foot
     in the gym in a long time (no point nagging someone who's clearly
     already left, vs. someone due but still training regularly). */
  function attendanceBadge(m) {
    if (m.memberType === 'personal-training') return '';
    if (!m.lastAttendedDate) return `<span class="attend-line none" style="display:inline-block;">Not seen in tracked attendance</span>`;
    const daysAgo = Math.floor((Date.now() - new Date(m.lastAttendedDate).getTime()) / 86400000);
    if (daysAgo <= 7) return '';  // recently active, no need to call it out
    const cls = daysAgo <= 20 ? 'stale' : 'none';
    return `<span class="attend-line ${cls}" style="display:inline-block;">Not seen in ${daysAgo}d (attended ${m.presentCount || 0}× in last 3 months)</span>`;
  }

  function renderMembers() {
    const search = document.getElementById('search-input').value.trim().toUpperCase();
    const list = document.getElementById('members-list');
    let filtered = allMembers;
    if (activeDueFilter !== 'all') filtered = filtered.filter(m => dueStatus(m).cls === activeDueFilter);
    if (search) filtered = filtered.filter(m => (m.name || '').includes(search));
    filtered = [...filtered].sort((a, b) => (a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : 1);

    const isGuessView = activeDueFilter === 'unknown';
    // Selection only makes sense while looking at this exact filtered set —
    // switching away/back or re-searching drops stale picks rather than
    // risk bulk-confirming a member no longer even visible.
    if (isGuessView) {
      const visibleIds = new Set(filtered.map(m => m.id));
      selectedGuessIds = new Set([...selectedGuessIds].filter(id => visibleIds.has(id)));
    } else if (selectedGuessIds.size) {
      selectedGuessIds = new Set();
    }

    const bulkBar = isGuessView ? `
      <div class="guess-bulk-bar" id="guess-bulk-bar">
        <label class="guess-select-all">
          <input type="checkbox" id="guess-select-all-cb" ${filtered.length && selectedGuessIds.size === filtered.length ? 'checked' : ''}>
          Select all
        </label>
        <span id="guess-selected-count">${selectedGuessIds.size} selected</span>
        <button class="btn btn-primary btn-sm" id="guess-confirm-selected-btn" ${selectedGuessIds.size ? '' : 'disabled'}>
          Confirm Selected Plans
        </button>
      </div>` : '';

    if (!filtered.length) { list.innerHTML = bulkBar + '<div class="empty">No members match this view.</div>'; return; }

    list.innerHTML = bulkBar + filtered.map(m => {
      const status = dueStatus(m);
      const contactBlock = m.contactHidden
        ? `<span class="contact-hidden-label">Contact hidden</span>`
        : `<div class="contact-block">
             <div class="contact-item"><span class="k">Phone</span><span>${m.phone || '—'}</span></div>
             <div class="contact-item"><span class="k">Email</span><span>${m.email || '—'}</span></div>
           </div>`;
      const payLine = paymentLine(m);
      const attendBadge = attendanceBadge(m);
      const pauseNote = m.pausedUntil ? `<div class="attend-line" style="color:var(--blue);">Paused until ${formatShortDate(m.pausedUntil)}</div>` : '';

      let guessBlock = '';
      if (isGuessView) {
        const isKid = m.memberType === 'kids';
        const guess = guessPlanFromAmount(m.lastPaymentAmount, isKid);
        const amountLabel = m.lastPaymentAmount
          ? `₹${m.lastPaymentAmount.toLocaleString('en-IN')}${m.lastPaymentDate ? ' on ' + formatShortDate(m.lastPaymentDate) : ''}`
          : 'No payment on record — can’t guess';
        const confidenceBadge = guess.confidence
          ? `<span class="guess-confidence ${guess.confidence}">${guess.confidence === 'high' ? 'confident guess' : 'rough guess'}</span>`
          : '';
        const options = Object.keys(PLAN_LABELS).map(key =>
          `<option value="${key}" ${key === guess.plan ? 'selected' : ''}>${PLAN_LABELS[key]}</option>`).join('');
        // True exception case: nothing at all to anchor a due date to (no
        // start date, no payment date — e.g. Kanika Parwal) — a plan alone
        // can never get a due date for these without manual input, so they
        // get extra fields instead of just being silently stuck. Deliberately
        // scoped to only this small group (~15 people), not every no-plan
        // member, per your instruction not to add fields nobody else needs.
        const isAnchorless = !m.startDate && !m.lastPaymentDate;
        const canAct = m.lastPaymentAmount || isAnchorless;
        const anchorFields = isAnchorless ? `
              <div class="guess-anchor-fields">
                <label>Start date <input type="date" class="guess-startdate-input" data-id="${m.id}"></label>
                <label>Due date <input type="date" class="guess-duedate-input" data-id="${m.id}"></label>
              </div>` : '';
        guessBlock = `
          <div class="guess-row" data-id="${m.id}">
            <input type="checkbox" class="guess-select-cb" data-id="${m.id}" ${selectedGuessIds.has(m.id) ? 'checked' : ''} ${canAct ? '' : 'disabled'}>
            <div class="guess-info">
              <span class="guess-amount">${amountLabel}</span>
              <div class="guess-plan-line">
                <select class="guess-plan-select" data-id="${m.id}" ${canAct ? '' : 'disabled'}>
                  <option value="">— guess plan —</option>
                  ${options}
                </select>
                ${confidenceBadge}
              </div>
              ${anchorFields}
            </div>
            <button class="btn btn-ghost btn-sm guess-confirm-btn" data-id="${m.id}" title="Confirm this plan" ${canAct ? '' : 'disabled'}>&#10003; Confirm</button>
          </div>`;
      }

      return `
        <div class="member-card" data-id="${m.id}">
          <div class="member-top">
            <div>
              <div class="member-name">${m.name || '—'}</div>
              <div class="member-meta">${(m.center||'—').toUpperCase()} · ${m.plan || 'no plan set'} · ${m.memberType === 'personal-training' ? 'Personal Training' : m.memberType === 'kids' ? 'Kids' : 'General'}</div>
              ${payLine}
              ${attendBadge}
              ${pauseNote}
            </div>
            <span class="pill ${status.cls}">${status.label}${m.dueDate ? ' · ' + formatShortDate(m.dueDate) : ''}</span>
          </div>
          ${guessBlock}
          <div class="member-row2">
            ${contactBlock}
            <div class="card-actions">
              ${myRole === 'owner' && m.contactHidden ? `<button class="btn btn-ghost btn-sm reveal-btn" data-id="${m.id}">Show Contact</button>` : ''}
              <button class="btn btn-ghost btn-sm edit-btn" data-id="${m.id}">Edit</button>
            </div>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('.reveal-btn').forEach(btn => btn.addEventListener('click', () => revealContact(btn.dataset.id, btn)));
    list.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
    // Tapping anywhere on the card opens Edit — except on an actual control
    // (button/select/input/checkbox), which should do its own thing instead.
    list.querySelectorAll('.member-card').forEach(card => card.addEventListener('click', (e) => {
      if (e.target.closest('button, select, input, a, label')) return;
      openEditModal(card.dataset.id);
    }));

    if (isGuessView) {
      list.querySelectorAll('.guess-select-cb').forEach(cb => cb.addEventListener('change', () => {
        if (cb.checked) selectedGuessIds.add(cb.dataset.id); else selectedGuessIds.delete(cb.dataset.id);
        renderMembers();
      }));
      const selectAllCb = document.getElementById('guess-select-all-cb');
      if (selectAllCb) selectAllCb.addEventListener('change', () => {
        if (selectAllCb.checked) filtered.forEach(m => { if (m.lastPaymentAmount) selectedGuessIds.add(m.id); });
        else selectedGuessIds.clear();
        renderMembers();
      });
      const confirmSelectedBtn = document.getElementById('guess-confirm-selected-btn');
      if (confirmSelectedBtn) confirmSelectedBtn.addEventListener('click', () => confirmGuessedPlans([...selectedGuessIds], [confirmSelectedBtn]));
      list.querySelectorAll('.guess-confirm-btn').forEach(btn => btn.addEventListener('click', () => confirmGuessedPlans([btn.dataset.id], [btn])));
    }
  }

  async function confirmGuessedPlans(ids, triggerBtns) {
    if (!ids.length) return;
    // Immediate feedback — the round trip (auth check, Firestore read+write,
    // then a full member reload) can take several seconds, and with nothing
    // changing on screen in that window it reads as "the click did nothing".
    // Not restored on failure: renderMembers() always replaces this button
    // right after (success or error), so there's nothing to restore to.
    triggerBtns.forEach(btn => { btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Confirming…'; });

    const results = await Promise.allSettled(ids.map(id => {
      const row = document.querySelector(`.guess-row[data-id="${id}"]`);
      const select = row ? row.querySelector('.guess-plan-select') : null;
      const plan = select ? select.value : '';
      if (!plan) return Promise.reject(new Error('no plan selected'));
      const body = { id, plan };
      const startDateInput = row ? row.querySelector('.guess-startdate-input') : null;
      const dueDateInput = row ? row.querySelector('.guess-duedate-input') : null;
      if (startDateInput && startDateInput.value) body.startDate = startDateInput.value;
      if (dueDateInput && dueDateInput.value) body.dueDate = dueDateInput.value;
      return api('/api/staff/members', { method: 'POST', body: JSON.stringify(body) });
    }));
    const failed = results.filter(r => r.status === 'rejected').length;
    selectedGuessIds.clear();
    await loadMembers();
    if (failed) alert(`${failed} of ${ids.length} could not be confirmed (no plan guessed for them).`);
  }

  async function revealContact(id, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span> Loading…';
    try {
      const { phone, email, address } = await api('/api/staff/reveal-contact', { method: 'POST', body: JSON.stringify({ id }) });
      const card = btn.closest('.member-card');
      card.querySelector('.contact-hidden-label, .contact-block').outerHTML =
        `<div class="contact-block">
           <div class="contact-item"><span class="k">Phone</span><span>${phone || '—'}</span></div>
           <div class="contact-item"><span class="k">Email</span><span>${email || '—'}</span></div>
           ${address ? `<div class="contact-item"><span class="k">Addr</span><span>${address}</span></div>` : ''}
         </div>`;
      btn.remove();
    } catch (e) {
      alert('Failed: ' + e.message);
      btn.disabled = false; btn.textContent = 'Show Contact';
    }
  }

  /* ── Edit / Add modal ── */
  let editingId = null;
  let pendingReviewIdToResolve = null; // set only when opened via "Fix Now" — auto-resolves that review item on Save
  function openEditModal(id) {
    pendingReviewIdToResolve = null;
    const m = allMembers.find(x => x.id === id);
    if (!m) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Member';
    document.getElementById('f-center-field').style.display = 'none';
    document.getElementById('f-name').value = m.name || '';
    document.getElementById('f-plan').value = m.plan || '';
    document.getElementById('f-start').value = m.startDate || '';
    document.getElementById('f-due').value = m.dueDate || '';
    document.getElementById('f-fee').value = m.defaultFeeAmount || '';
    document.getElementById('f-phone').value = m.contactHidden ? '' : (m.phone || '');
    document.getElementById('f-email').value = m.contactHidden ? '' : (m.email || '');
    document.getElementById('f-phone').placeholder = m.contactHidden ? 'Hidden — Show Contact first to edit' : '';
    document.getElementById('f-email').placeholder = m.contactHidden ? 'Hidden — Show Contact first to edit' : '';
    document.getElementById('f-paused').value = m.pausedUntil || '';
    document.getElementById('edit-err').style.display = 'none';
    document.getElementById('edit-backdrop').classList.add('show');
    renderAttendanceSummary(m);
    loadPaymentHistory(id, m);
    if (myRole === 'owner') loadChangeHistory(id);
    else document.getElementById('change-history-field').style.display = 'none';
  }

  // Field-name -> friendly label, and which ones matter enough to
  // highlight — plan/dueDate are exactly the two fields the coalesce bug
  // silently wiped, so those are the ones worth being able to spot fast.
  const CHANGE_FIELD_LABELS = {
    plan: 'Plan', dueDate: 'Due Date', startDate: 'Start Date', status: 'Status',
    lastPaymentAmount: 'Last Payment Amount', lastPaymentDate: 'Last Payment Date',
    verificationDismissedAt: 'Verification Dismissed', pausedUntil: 'Paused Until',
  };
  const CHANGE_FIELD_HIGHLIGHT = new Set(['plan', 'dueDate']);

  function describeChangeDetail(detail) {
    if (!detail || typeof detail !== 'object') return '';
    const parts = Object.keys(detail)
      .filter(k => k in CHANGE_FIELD_LABELS)
      .map(k => `<span class="${CHANGE_FIELD_HIGHLIGHT.has(k) ? 'change-field-hl' : ''}">${CHANGE_FIELD_LABELS[k]}: ${detail[k] === null ? '—' : detail[k]}</span>`);
    return parts.join(', ');
  }

  async function loadChangeHistory(memberId) {
    const field = document.getElementById('change-history-field');
    const list = document.getElementById('change-history-list');
    field.style.display = 'block';
    list.innerHTML = '<span class="spinner sm"></span> Loading…';
    try {
      const { entries } = await api(`/api/staff/audit-log?memberId=${memberId}&limit=15`);
      if (!entries.length) { list.innerHTML = 'No changes on record.'; return; }
      list.innerHTML = entries.map(e => {
        const when = e.timestamp ? new Date(e.timestamp._seconds ? e.timestamp._seconds * 1000 : e.timestamp).toLocaleString() : 'unknown time';
        const changeDesc = describeChangeDetail(e.detail);
        return `<div>${when} — <strong style="color:var(--text);">${e.actorName || 'unknown'}</strong>${changeDesc ? ': ' + changeDesc : ' (' + e.action + ')'}</div>`;
      }).join('');
    } catch (e) {
      list.innerHTML = 'Failed to load: ' + e.message;
    }
  }

  // Both numbers are precomputed at sync time (see sync-sheets.js) — this
  // is a plain read of already-stored fields, no extra API call or live
  // recomputation when opening the modal.
  function renderAttendanceSummary(m) {
    const field = document.getElementById('attendance-summary-field');
    const box = document.getElementById('attendance-summary');
    if (m.memberType === 'personal-training') { field.style.display = 'none'; return; }
    field.style.display = 'block';
    const afterDueLine = m.dueDate
      ? `${m.daysAttendedAfterDue ?? 0} day${(m.daysAttendedAfterDue ?? 0) === 1 ? '' : 's'} attended since their due date (${formatShortDate(m.dueDate)})`
      : `No due date on record — can't measure "attended after due"`;
    const thisMonthLine = `${m.daysAttendedThisMonth ?? 0} day${(m.daysAttendedThisMonth ?? 0) === 1 ? '' : 's'} attended this month`;
    box.innerHTML = `<div>${afterDueLine}</div><div>${thisMonthLine}</div>`;
  }

  async function loadPaymentHistory(memberId, member) {
    const field = document.getElementById('payment-history-field');
    const list = document.getElementById('payment-history-list');
    field.style.display = 'block';
    list.innerHTML = '<span class="spinner sm"></span> Loading…';
    try {
      const { payments } = await api(`/api/staff/members?payments=${memberId}`);
      if (!payments.length) {
        // A member's lastPaymentDate/Amount can come from the sync's
        // long-cycle lookback, which only detects that a payment happened
        // in some older month's tab — it never creates a payment document
        // for it (that'd mean fabricating legs/channel data that was never
        // actually in the sheet). So "no payment docs" and "we know they
        // paid" can both be true at once — show what's known instead of a
        // flat "no payments", which read as contradicting the member card's
        // own "Last fee paid on ..." line right above this same modal.
        list.innerHTML = member && member.lastPaymentDate
          ? `<div style="color:var(--muted);">No detailed payment record — but last known payment was <strong style="color:var(--text);">${member.lastPaymentAmount ? '₹' + member.lastPaymentAmount.toLocaleString('en-IN') + ' ' : ''}on ${formatShortDate(member.lastPaymentDate)}</strong> (found from older sheet history, not a logged transaction).</div>`
          : 'No payments on record.';
        return;
      }
      list.innerHTML = payments.map(p => {
        const legs = (p.legs || []).map(l => `${l.channel} ₹${l.amount.toLocaleString('en-IN')}`).join(', ');
        // Saket's sheet has no per-payment date column at all — fall back
        // to which month's tab it was recorded in, rather than a bare dash.
        const whenLabel = formatShortDate(p.date) || (p.paymentTab ? `recorded in ${p.paymentTab}` : 'date unknown');
        return `<div>${whenLabel} — <strong style="color:var(--text);">₹${(p.totalAmount||0).toLocaleString('en-IN')}</strong>${legs ? ' (' + legs + ')' : ''}</div>`;
      }).join('');
    } catch (e) {
      list.innerHTML = 'Failed to load: ' + e.message;
    }
  }

  function openAddModal() {
    editingId = null;
    pendingReviewIdToResolve = null;
    document.getElementById('payment-history-field').style.display = 'none';
    document.getElementById('attendance-summary-field').style.display = 'none';
    document.getElementById('change-history-field').style.display = 'none';
    document.getElementById('modal-title').textContent = 'Add Member';
    document.getElementById('f-center-field').style.display = 'block';
    document.getElementById('f-center').value = document.getElementById('center-filter').value === 'lajpat' ? 'lajpat' : 'saket';
    document.getElementById('f-name').value = '';
    document.getElementById('f-plan').value = '';
    document.getElementById('f-start').value = '';
    document.getElementById('f-due').value = '';
    document.getElementById('f-fee').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-email').value = '';
    document.getElementById('f-phone').placeholder = '';
    document.getElementById('f-email').placeholder = '';
    document.getElementById('f-paused').value = '';
    document.getElementById('edit-err').style.display = 'none';
    document.getElementById('edit-backdrop').classList.add('show');
  }
  document.getElementById('add-member-btn').addEventListener('click', openAddModal);

  function closeEditModal() { document.getElementById('edit-backdrop').classList.remove('show'); editingId = null; }
  document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
  document.getElementById('edit-backdrop').addEventListener('click', e => { if (e.target.id === 'edit-backdrop') closeEditModal(); });

  document.getElementById('edit-save').addEventListener('click', async () => {
    const btn = document.getElementById('edit-save');
    const errEl = document.getElementById('edit-err');
    errEl.style.display = 'none';
    const name = document.getElementById('f-name').value.trim();
    if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = 'block'; return; }

    const payload = {
      name,
      plan: document.getElementById('f-plan').value || null,
      startDate: document.getElementById('f-start').value || null,
      dueDate: document.getElementById('f-due').value || null,
      defaultFeeAmount: document.getElementById('f-fee').value ? parseFloat(document.getElementById('f-fee').value) : null,
      pausedUntil: document.getElementById('f-paused').value || null,
    };
    if (editingId) payload.id = editingId;
    else payload.center = document.getElementById('f-center').value;

    const phoneVal = document.getElementById('f-phone').value.trim();
    const emailVal = document.getElementById('f-email').value.trim();
    if (phoneVal) payload.phone = phoneVal;
    if (emailVal) payload.email = emailVal;

    btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Saving…';
    try {
      await api('/api/staff/members', { method: 'POST', body: JSON.stringify(payload) });
      const resolvingReviewId = pendingReviewIdToResolve;
      closeEditModal();
      await loadMembers();
      if (resolvingReviewId) {
        await api('/api/staff/migration-review', { method: 'POST', body: JSON.stringify({ id: resolvingReviewId, resolution: 'confirm' }) }).catch(() => {});
        await loadReview(); // stays on the Review tab, same scroll position, item now gone
      }
    } catch (e) {
      errEl.textContent = 'Save failed: ' + e.message;
      errEl.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Save';
  });

  document.getElementById('center-filter').addEventListener('change', loadMembers);
  document.getElementById('search-input').addEventListener('input', renderMembers);

  /* ── Sync Now — animated progress since the server doesn't stream real progress ── */
  const SYNC_STEPS = [
    { at: 0,    label: 'Reading Saket sheet…' },
    { at: 3000, label: 'Reading Lajpat sheet…' },
    { at: 8000, label: 'Matching members and payments…' },
    { at: 13000, label: 'Matching Bank Receipts…' },
    { at: 17000, label: 'Writing to database…' },
  ];
  document.getElementById('sync-btn').addEventListener('click', async () => {
    const btn = document.getElementById('sync-btn');
    const panel = document.getElementById('sync-panel');
    const fill = document.getElementById('progress-fill');
    const statusText = document.getElementById('sync-status-text');
    const spinner = document.getElementById('sync-spinner');
    const resultEl = document.getElementById('sync-result');

    btn.disabled = true;
    panel.classList.add('show');
    resultEl.innerHTML = '';
    spinner.style.display = 'inline-block';
    fill.style.width = '4%';

    const startedAt = Date.now();
    const EXPECTED_MS = 22000; // observed ~17-23s live; used only to pace the bar, not a hard limit
    const timers = SYNC_STEPS.map(step => setTimeout(() => { statusText.textContent = step.label; }, step.at));
    const progressTimer = setInterval(() => {
      const pct = Math.min(92, 4 + (Date.now() - startedAt) / EXPECTED_MS * 88);
      fill.style.width = pct + '%';
    }, 200);

    try {
      // Scope the sync to whatever center is currently selected in the
      // dashboard filter — "All Centers" syncs both, but picking one center
      // means only that sheet gets read/written, not both every time.
      const centerFilter = document.getElementById('center-filter').value;
      const { summary: s } = await api('/api/staff/sync-sheets', { method: 'POST', body: JSON.stringify({ center: centerFilter }) });
      clearInterval(progressTimer);
      timers.forEach(clearTimeout);
      fill.style.width = '100%';
      spinner.style.display = 'none';
      const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
      statusText.textContent = `Done in ${elapsed}s`;
      const saketLine = centerFilter === 'lajpat'
        ? `<div><strong>Saket</strong> — skipped (filter set to Lajpat Nagar)</div>`
        : `<div><strong>Saket</strong> — ${s.saket.membersUpserted} members, ${s.saket.paymentsWritten} payments, ${s.saket.reviewQueued} flagged for review${s.saket.membersDuplicateSkipped ? `, ${s.saket.membersDuplicateSkipped} duplicate names skipped` : ''}</div>`;
      const lajpatLine = centerFilter === 'saket'
        ? `<div><strong>Lajpat Nagar</strong> — skipped (filter set to Saket)</div>`
        : `<div><strong>Lajpat Nagar</strong> — ${s.lajpat.membersUpserted} members, ${s.lajpat.paymentsWritten} payments, ${s.lajpat.reviewQueued} flagged for review${s.lajpat.membersDuplicateSkipped ? `, ${s.lajpat.membersDuplicateSkipped} duplicate names skipped` : ''}</div>`;
      resultEl.innerHTML = `
        ${saketLine}
        ${lajpatLine}
        ${centerFilter !== 'saket' ? `<div><strong>Bank Receipts</strong> — ${s.lajpat.bankReceiptsMatched} matched, ${s.lajpat.bankReceiptsUnmatched} unmatched (added to review)</div>` : ''}
        <div style="margin-top:6px;color:var(--faint);">Tabs read — ${centerFilter !== 'lajpat' ? 'Saket: ' + (s.saket.tabs.join(', ') || '—') : ''}${centerFilter === 'all' ? ' · ' : ''}${centerFilter !== 'saket' ? 'Lajpat: ' + (s.lajpat.tabs.join(', ') || '—') : ''}</div>
      `;
      await loadMembers();
    } catch (e) {
      clearInterval(progressTimer);
      timers.forEach(clearTimeout);
      spinner.style.display = 'none';
      statusText.textContent = 'Sync failed';
      resultEl.innerHTML = `<div style="color:var(--red);">${e.message}</div>`;
    }
    btn.disabled = false;
  });

  /* ── Migration Review ── */
  /* Turns each review item into a plain-language sentence a non-technical
     coach can act on, instead of a raw JSON dump of rawData. */
  function describeReview(item) {
    const d = item.rawData || {};
    const center = item.sheet === 'saket' ? 'Saket' : 'Lajpat Nagar';
    switch (item.type) {
      case 'missing-plan':
        return { title: `${d.name} — no plan on file`, detail: `We don't know if ${d.name} (${center}) is on a monthly, quarterly, half-yearly or yearly plan. Check the sheet or ask them, then set it on their profile.` };
      case 'ambiguous-date':
        return { title: `${d.name} — couldn't read their start date`, detail: `The sheet has "${d.rawStart || d.rawJoin || '(blank)'}" in the date column, which we couldn't understand. Open their row in the sheet and set the correct start date on their profile.` };
      case 'duplicate-name':
        return { title: `${d.name} — appears more than once`, detail: `There are multiple people named "${d.name}" in ${center}. Check if they're the same person (merge by editing one and removing the duplicate row in the sheet) or two different people (rename one to tell them apart, e.g. add a last name).` };
      case 'name-mismatch':
        return { title: `Unrecognized name on a payment: "${d.name}"`, detail: `A payment of ₹${d.amt || '?'} on ${d.date || '?'} (mode: ${d.mode || '?'}) was recorded for someone named "${d.name}", but we couldn't find them in the member list.` + (item.suggestedMatch ? ` Did they mean "${item.suggestedMatch}"?` : ' No close match found — check the Bank Receipts sheet.') };
      case 'unmapped-payment-channel':
        return { title: `${d.name} — payment received, but not who it went to`, detail: `${d.name} paid ₹${d.amount || d.amt || '?'}, but the sheet doesn't say if it went to cash, Harish, Ankit, or the company account (remark: "${d.remark || d.pmode || '(blank)'}"). Check with whoever collected it.` };
      case 'unclassified-row':
        return { title: `${d.name || '(unnamed row)'} — needs a closer look`, detail: d.note === 'missing duration' ? `${d.name} has no plan duration recorded.` : (d.name && /TRAIL|TRIAL/i.test(d.name)) ? `"${d.name}" looks like a one-off trial visit, not a regular member — decide if this needs a real member profile.` : `This row in ${center} didn't fit any of the usual patterns — take a look at the raw sheet row below.` };
      case 'payment-verification-needed':
        return { title: `${d.name} — overdue a long time, but still training regularly`, detail: `${d.name} (${center}) has been overdue since ${formatShortDate(d.dueDate) || d.dueDate}, but attended as recently as ${formatShortDate(d.lastAttendedDate) || d.lastAttendedDate} (${d.presentCount} days in the last 3 months). This usually means they've actually paid and it just wasn't recorded — check with them or look for the missing payment, rather than treating this as a normal reminder case.` };
      default:
        return { title: d.name || item.type, detail: JSON.stringify(d) };
    }
  }

  const FIXABLE_TYPES = ['missing-plan', 'ambiguous-date', 'unclassified-row', 'payment-verification-needed'];

  async function loadReview() {
    const list = document.getElementById('review-list');
    const centerFilter = document.getElementById('review-center-filter').value;
    list.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading…</div>';
    try {
      const { items: allItems } = await api('/api/staff/migration-review');
      document.getElementById('review-count').textContent = allItems.length || '';
      const items = centerFilter === 'all' ? allItems : allItems.filter(i => i.sheet === centerFilter);
      if (!items.length) { list.innerHTML = '<div class="empty">All clear — nothing pending review here.</div>'; return; }
      list.innerHTML = items.map(item => {
        const { title, detail } = describeReview(item);
        const name = item.rawData && item.rawData.name;
        const canFixNow = FIXABLE_TYPES.includes(item.type) && name;
        // A trial visit that was never given a real member profile — Fix
        // Now would fail to find them (they were never created), so offer
        // to create one instead, prefilled with what little we know.
        const isUnprofiledTrial = item.type === 'unclassified-row' && name && /TRAIL|TRIAL/i.test(name);
        const isVerification = item.type === 'payment-verification-needed';
        let actions;
        if (isVerification) {
          // Generic Dismiss/Confirm don't say what they mean here — two
          // explicit outcomes instead: either you found the real payment
          // (opens their profile to enter it), or you checked and they
          // genuinely haven't paid (stops re-flagging them for 2 weeks so
          // this doesn't just reappear on every sync while you follow up).
          actions = `
            <button class="btn btn-sm fix-now-btn" data-id="${item.id}" data-name="${name}">They've Paid — Let Me Fix It</button>
            <button class="btn btn-ghost btn-sm dismiss-verify-btn" data-id="${item.id}" data-member-id="${item.rawData.memberId}">No, Genuinely Due</button>`;
        } else {
          actions = `
            ${isUnprofiledTrial ? `<button class="btn btn-sm add-as-member-btn" data-id="${item.id}" data-name="${name}" data-center="${item.sheet}">Add as Member</button>`
              : canFixNow ? `<button class="btn btn-sm fix-now-btn" data-id="${item.id}" data-name="${name}">Fix Now</button>` : ''}
            <button class="btn btn-ghost btn-sm reject-btn" data-id="${item.id}">Not Relevant / Dismiss</button>
            <button class="btn btn-ghost btn-sm confirm-btn" data-id="${item.id}">I've Fixed This</button>`;
        }
        return `
        <div class="review-card" data-id="${item.id}">
          <div class="review-type">${title}</div>
          <div class="review-sub">${item.sheet === 'saket' ? 'Saket' : 'Lajpat Nagar'} · ${item.tab || ''}</div>
          <div class="review-data">${detail}</div>
          <div class="review-actions">${actions}</div>
        </div>`;
      }).join('');
      list.querySelectorAll('.reject-btn').forEach(b => b.addEventListener('click', () => resolveReview(b.dataset.id, 'reject', b)));
      list.querySelectorAll('.confirm-btn').forEach(b => b.addEventListener('click', () => resolveReview(b.dataset.id, 'confirm', b)));
      list.querySelectorAll('.fix-now-btn').forEach(b => b.addEventListener('click', () => fixNow(b.dataset.name, b.dataset.id)));
      list.querySelectorAll('.dismiss-verify-btn').forEach(b => b.addEventListener('click', () => dismissVerification(b.dataset.id, b.dataset.memberId, b)));
      list.querySelectorAll('.add-as-member-btn').forEach(b => b.addEventListener('click', () => {
        const item = items.find(i => i.id === b.dataset.id);
        openAddModal();
        pendingReviewIdToResolve = b.dataset.id;
        document.getElementById('f-name').value = b.dataset.name.replace(/\s*\(?TRIAL\)?/i, '').trim();
        document.getElementById('f-center').value = b.dataset.center;
        // Best-effort prefill from whatever the raw sheet row happened to
        // contain — the row's column positions aren't preserved here, so
        // this pattern-matches rather than reading a named field.
        const row = item && item.rawData && item.rawData.row;
        if (Array.isArray(row)) {
          const emailCell = row.find(c => typeof c === 'string' && /@/.test(c));
          const phoneCell = row.find(c => typeof c === 'string' && /^[6-9]\d{9}$/.test(c.trim()));
          if (emailCell) document.getElementById('f-email').value = emailCell.trim();
          if (phoneCell) document.getElementById('f-phone').value = phoneCell.trim();
        }
      }));
    } catch (e) {
      list.innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
    }
  }

  /* Jumps to Members tab, finds the member by name (fetching all-centers
     first if needed), and opens the edit modal directly — so fixing a
     flagged issue doesn't mean losing your place searching around. */
  /* Deliberately does NOT switch to the Members tab — the modal is a fixed
     overlay, so opening it here keeps you on the Review list at the same
     scroll position. Saving auto-resolves the review item too (see
     edit-save handler), so working through a long queue is: Fix Now ->
     edit -> Save -> next item, no tab-hopping in between. */
  async function fixNow(name, reviewItemId) {
    let member = allMembers.find(m => m.name === name);
    if (!member) {
      const prevCenter = document.getElementById('center-filter').value;
      document.getElementById('center-filter').value = 'all';
      await loadMembers();
      document.getElementById('center-filter').value = prevCenter; // restore, don't disturb their Members-tab filter
      member = allMembers.find(m => m.name === name);
    }
    if (member) {
      openEditModal(member.id);
      pendingReviewIdToResolve = reviewItemId;
    } else {
      alert(`Couldn't find an exact match for "${name}" — try "Add as Member" instead if one is available on this item.`);
    }
  }

  async function resolveReview(id, resolution, btn) {
    const card = btn.closest('.review-card');
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    btn.innerHTML = '<span class="spinner sm"></span>';
    try {
      await api('/api/staff/migration-review', { method: 'POST', body: JSON.stringify({ id, resolution }) });
      loadReview();
    } catch (e) {
      alert('Failed: ' + e.message);
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  /* "No, Genuinely Due" — resolves the review item AND tells the next sync
     to stop re-flagging this member as needs-verification for 14 days
     (the underlying pattern — long overdue + still attending — doesn't
     go away on its own, so without this the same item would just
     reappear on the very next sync). */
  async function dismissVerification(reviewId, memberId, btn) {
    const card = btn.closest('.review-card');
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    btn.innerHTML = '<span class="spinner sm"></span>';
    try {
      await api('/api/staff/members', { method: 'POST', body: JSON.stringify({ id: memberId, verificationDismissedAt: new Date().toISOString().slice(0, 10) }) });
      await api('/api/staff/migration-review', { method: 'POST', body: JSON.stringify({ id: reviewId, resolution: 'reject' }) });
      loadReview();
    } catch (e) {
      alert('Failed: ' + e.message);
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  document.getElementById('refresh-review-btn').addEventListener('click', loadReview);
  document.getElementById('review-center-filter').addEventListener('change', loadReview);

  /* ── Audit Log ── */
  let auditEntries = [];
  async function loadAudit() {
    const list = document.getElementById('audit-list');
    list.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading…</div>';
    try {
      const { entries } = await api('/api/staff/audit-log');
      auditEntries = entries;
      renderAudit();
    } catch (e) {
      list.innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
    }
  }

  function renderAudit() {
    const list = document.getElementById('audit-list');
    const search = document.getElementById('audit-search').value.trim().toUpperCase();
    // Resolves member IDs to names using whatever's already loaded in the
    // Members tab (no extra API call) — falls back to the raw ID for a
    // member outside the currently-selected center filter, which is rare
    // enough not to be worth a dedicated lookup call just for this.
    const nameById = new Map(allMembers.map(m => [m.id, m.name]));
    let entries = auditEntries;
    if (search) {
      entries = entries.filter(e => {
        const memberName = (e.targetMemberId && nameById.get(e.targetMemberId)) || '';
        return memberName.toUpperCase().includes(search) || (e.actorName || '').toUpperCase().includes(search);
      });
    }
    if (!entries.length) { list.innerHTML = '<div class="empty">No activity matches.</div>'; return; }
    list.innerHTML = entries.map(e => {
      const memberName = e.targetMemberId ? (nameById.get(e.targetMemberId) || `member ${e.targetMemberId}`) : null;
      const changeDesc = describeChangeDetail(e.detail);
      const when = e.timestamp ? new Date(e.timestamp._seconds ? e.timestamp._seconds * 1000 : e.timestamp).toLocaleString() : '';
      return `
        <div class="audit-row">
          <span class="audit-actor">${e.actorName || e.actorUid}</span> —
          <span class="audit-action">${e.action}</span>
          ${memberName ? ' · ' + memberName : ''}
          ${changeDesc ? `<div style="margin-top:2px;">${changeDesc}</div>` : ''}
          <div class="audit-time">${when}</div>
        </div>`;
    }).join('');
  }
  document.getElementById('audit-search').addEventListener('input', renderAudit);
</script>

</body>
</html>
