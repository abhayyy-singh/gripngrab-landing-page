<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grip&amp;Grab Staff — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c0c; --surface: #161616; --border: rgba(255,255,255,0.07);
      --text: #f0f0f0; --muted: rgba(255,255,255,0.4); --accent: #ff6b6b;
    }
    body {
      font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 20px; width: 100%; max-width: 360px; }
    @media (min-width: 480px) { .login-card { padding: 40px 36px; } }
    .login-logo { background: linear-gradient(135deg,#ff6b6b,#f7d794); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .login-tag { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .login-err {
      background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.25);
      border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #ff8a8a;
      margin-bottom: 14px; display: none;
    }
    .login-input {
      width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border); border-radius: 12px; color: var(--text);
      font-size: 16px; font-family: 'Poppins', sans-serif; margin-bottom: 10px;
      transition: border-color .2s; -webkit-appearance: none;
    }
    .login-input::placeholder { color: var(--muted); }
    .login-input:focus { outline: none; border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 15px; background: linear-gradient(135deg,#ff6b6b,#f7d794);
      border: none; border-radius: 12px; color: #000; font-size: 15px; font-weight: 700;
      font-family: 'Poppins', sans-serif; cursor: pointer; margin-top: 4px; transition: opacity .2s;
    }
    .login-btn:active { opacity: .85; }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">Grip&amp;Grab</div>
  <div class="login-tag">Staff — Fee &amp; Membership Panel</div>
  <div class="login-err" id="login-err"></div>
  <input type="email"    class="login-input" id="login-email"    placeholder="Email"    autocomplete="email">
  <input type="password" class="login-input" id="login-password" placeholder="Password" autocomplete="current-password">
  <button class="login-btn" id="login-btn">Sign In</button>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const FIREBASE_CONFIG = {
    apiKey:            'AIzaSyB8hiRT58l-n5f5nbaqtuViCJeOqEMp-_k',
    authDomain:        'gripngrab.firebaseapp.com',
    projectId:         'gripngrab',
    storageBucket:     'gripngrab.firebasestorage.app',
    messagingSenderId: '568040807328',
    appId:             '1:568040807328:web:e9ee4f1328064a3d69e2c5',
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);

  onAuthStateChanged(auth, user => {
    if (user) window.location.href = './index.html';
  });

  const emailEl = document.getElementById('login-email');
  const passEl  = document.getElementById('login-password');
  const errEl   = document.getElementById('login-err');
  const btn     = document.getElementById('login-btn');

  async function doLogin() {
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value);
      // onAuthStateChanged handles redirect
    } catch (e) {
      errEl.textContent = 'Invalid email or password.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  btn.addEventListener('click', doLogin);
  passEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>

</body>
</html>
